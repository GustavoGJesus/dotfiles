# lazygit — tema Tokyo Night + Nerd Font (configurado por Claude Code)
gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#292e42"
    cherryPickedCommitBgColor:
      - "#3b4261"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#c0caf5"
    searchingActiveBorderColor:
      - "#e0af68"
  authorColorDefault: "#bb9af7"
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
