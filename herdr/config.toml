# herdr — configuration (source of truth: ~/dotfiles/herdr/config.toml)
# Reload without restarting:  herdr server reload-config   (or prefix+shift+r)
# Validate after editing:     herdr config check
# Every option and default:   herdr --default-config

onboarding = false

[theme]
# Monokai Pro Ristretto, the same palette Ghostty runs (dotfiles/ghostty/config).
# Herdr has no built-in Ristretto, so "vesper" is only a warm dark fallback and
# every color token below is overridden explicitly.
name = "vesper"

# Ristretto's 8-step neutral ramp:
#   #2c2525  #403838  #5b5353  #72696a  #948a8b  #c3b7b8  #e6dcdd  #fff1f3
# and its six accents: coral #f38d70, gold #f9cc6c, green #adda78,
# cyan #85dacc, red #fd6883. Ristretto's periwinkle is deliberately unused.
[theme.custom]
# "reset" makes panes fall back to Ghostty's own background, so the window
# transparency and blur survive instead of being painted over.
panel_bg = "reset"
sidebar_bg = "#2c2525"
active_row_bg = "#403838"
selection_bg = "#5b5353"
surface0 = "#403838"
surface1 = "#5b5353"
surface_dim = "#241e1e"
overlay0 = "#72696a"
overlay1 = "#948a8b"
text = "#fff1f3"
subtext0 = "#c3b7b8"

# Coral is Ristretto's signature accent — the color of the active tab and of
# the highlighted row in the agent sidebar.
accent = "#f38d70"
peach = "#f38d70"
red = "#fd6883"
yellow = "#f9cc6c"
green = "#adda78"
teal = "#85dacc"
# Ristretto's cool accent is a periwinkle, which still reads as purple, so both
# of these cool slots are pinned to coral. The git branch under each workspace
# in the sidebar comes from one of them.
mauve = "#f38d70"
blue = "#f38d70"

[terminal]
# New panes inherit the current pane's directory (great for splits in the same project)
new_cwd = "follow"

[update]
channel = "stable"

[ui]
# true = Herdr captures the mouse: sidebar/tab/pane clicks work
# (one of the tool's best features).
# History (Jul 2026): jitter/ghost scrolling when moving the mouse over
# Claude panes was caused by a stale environment inherited from Warp
# (uninstalled since). If it ever comes back, the proven fallback is
# mouse_capture = false.
mouse_capture = true

# Fine scrolling in panes: 1 line per scroll tick (web-page feel, paired
# with CLAUDE_CODE_SCROLL_SPEED=1 in zshrc and Ghostty's multiplier).
# Bump to 2 if shell scrollback feels slow.
mouse_scroll_lines = 1

# Agent panel grouped by project space. "priority" turns it into an
# attention queue (blocked and finished agents float to the top).
agent_panel_sort = "spaces"

# In split panes, label each border with the agent running inside it,
# so a Claude pane is easy to tell apart from a dev-server shell.
show_agent_labels_on_pane_borders = true

# Claude Code keeps a short title of the task it is on in the terminal
# title; show it under every Claude row so the sidebar tells you what each
# agent is doing, not just that it is busy.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "machine", "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
]

# Native macOS notification when an agent in a background workspace
# finishes or is waiting for you (sounds are on by default).
# prefix+o jumps straight to the agent that notified you.
[ui.toast]
delivery = "system"

# ============================================================
#  Keybindings (prefix: ctrl+b · prefix+? lists everything)
# ============================================================

[keys]
# Cycle through every agent across all workspaces, like tabs for agents
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# Project launcher (ctrl+b, shift+o): fuzzy-pick a repo, then focus its
# workspace or open a new one with Claude Code already running.
# Script: herdr/bin/herdr-project, linked to ~/.local/bin by install.sh
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "herdr-project"
description = "open project (fzf) with Claude"
width = "70%"
height = "75%"

# lazygit in a modal popup (ctrl+b, alt+g)
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "85%"
height = "85%"

# reviewr: agent diff review sidebar (ctrl+b, alt+r)
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: review agent diff"

# file-viewer: file tree + diffs (ctrl+b, shift+f)
# (alt chords are unreliable on macOS: Option sends ESC+letter and the pair
# can arrive split, leaving a bare "f" = herdr's default search)
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin pane open --plugin herdr-file-viewer --entrypoint file-viewer"
description = "file viewer"

# Linear: pick an issue → creates worktree + workspace (ctrl+b, alt+l)
[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "tdi.worktree-from-linear.pick"
description = "Linear issue → worktree"
