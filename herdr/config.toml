# herdr — configuração (fonte da verdade: ~/dotfiles/herdr/config.toml)
# Recarregar sem reiniciar:  herdr server reload-config

onboarding = false

[theme]
# Mesmo tema do Ghostty/Starship/lazygit — tudo Tokyo Night
name = "tokyo-night"

[terminal]
# Panes novos herdam o diretório do pane atual (bom pra abrir split no mesmo projeto)
new_cwd = "follow"

[update]
channel = "stable"

[ui]
# true = Herdr captura o mouse: cliques na sidebar/tabs/panes funcionam
# (um dos diferenciais da ferramenta).
# Histórico (23/jul/2026): a "vibração"/scroll fantasma ao mover o mouse em
# panes com Claude tinha como causa provável o env herdado errado — o server
# do herdr foi iniciado de dentro do WARP, então os panes carregavam
# TERM_PROGRAM=WarpTerminal e o Claude Code ativava modo Warp dentro do
# herdr/Ghostty. Guard no ~/.zshrc normaliza o env; e SEMPRE inicie o
# herdr a partir do Ghostty (nunca do Warp).
mouse_capture = true

# Notificação nativa do macOS quando um agente em workspace de fundo
# termina ou fica esperando você (sons já vêm ligados por padrão)
[ui.toast]
delivery = "system"

# ============================================================
#  Atalhos custom (prefix padrão: ctrl+b)
# ============================================================

# lazygit em popup modal — ctrl+b, alt+g
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

# reviewr: sidebar de review dos diffs do agente — ctrl+b, alt+r
[[keys.command]]
key = "prefix+alt+r"
type = "shell"
command = "herdr plugin action invoke persiyanov.reviewr.toggle"

# file-viewer: árvore de arquivos + diffs — ctrl+b, alt+f
[[keys.command]]
key = "prefix+alt+f"
type = "shell"
command = "herdr plugin pane open --plugin herdr-file-viewer --entrypoint file-viewer"

# Linear: escolher issue → cria worktree + workspace — ctrl+b, alt+l
[[keys.command]]
key = "prefix+alt+l"
type = "shell"
command = "herdr plugin action invoke tdi.worktree-from-linear.pick"
