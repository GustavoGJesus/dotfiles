"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================
#  Clean one-line prompt (inspired by 0xDones)
#  Layout:   folder  branch status  languages  ❯
#  - directory in cyan; the git repo ROOT in green (its signature touch)
#  - no powerline, no backgrounds, no gradients
# ============================================================

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs$bun$python$rust$golang\
$cmd_duration\
$character"""

add_newline = true          # blank line before each prompt (breathing room)
command_timeout = 2000

# ---- Apple icon (subtle, gray) ----
[os]
disabled = false
format = "[$symbol ](fg:#565f89)"
[os.symbols]
Macos = ""

# ---- Directory: path in cyan, repo root in GREEN ----
[directory]
style = "cyan bold"
repo_root_style = "green bold"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 3
truncation_symbol = "…/"

# ---- Git branch (soft purple) ----
[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

# ---- Git status (yellow, only when something changed) ----
[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"

# ---- Git state (rebase/merge/cherry-pick in progress) ----
[git_state]
style = "bright-red"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# ---- Languages (subtle, gray) ----
[nodejs]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[bun]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[python]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[rust]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[golang]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "

# ---- Long command duration (only above 2s) ----
[cmd_duration]
min_time = 2000
style = "fg:#565f89"
format = "[ $duration]($style) "

# ---- Prompt character (green ok / red error) ----
[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](cyan bold)"
