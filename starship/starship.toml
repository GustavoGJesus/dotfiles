"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================
#  Prompt limpo, 1 linha (inspirado no 0xDones)
#  Layout:   pasta  branch status  linguagens  ❯
#  - diretório em ciano; a RAIZ do repo git em verde (assinatura dele)
#  - sem powerline, sem fundo, sem degradê
# ============================================================

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs$bun$python$rust$golang\
$cmd_duration\
$character"""

add_newline = true          # linha em branco antes de cada prompt (respiro)
command_timeout = 2000

# ---- Ícone da Apple (discreto, cinza) ----
[os]
disabled = false
format = "[$symbol ](fg:#565f89)"
[os.symbols]
Macos = ""

# ---- Pasta: caminho em ciano, raiz do repo em VERDE ----
[directory]
style = "cyan bold"
repo_root_style = "green bold"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 3
truncation_symbol = "…/"

# ---- Git branch (roxo suave) ----
[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

# ---- Git status (amarelo, só quando há mudança) ----
[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"

# ---- Git state (rebase/merge/cherry-pick em andamento) ----
[git_state]
style = "bright-red"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# ---- Linguagens (discretas, cinza) ----
[nodejs]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[bun]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[python]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[rust]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "
[golang]
symbol = " "
style = "fg:#565f89"
format = "[$symbol$version]($style) "

# ---- Duração de comandos longos (só acima de 2s) ----
[cmd_duration]
min_time = 2000
style = "fg:#565f89"
format = "[ $duration]($style) "

# ---- Caractere do prompt (verde ok / vermelho erro) ----
[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](cyan bold)"
